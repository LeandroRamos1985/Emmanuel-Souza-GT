name: Publish Emmanuel Souza
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare complete website
        run: |
          mkdir -p _public
          unzip -q Emmanuel-Souza-Site.zip -d _public
          rm -rf _public/_entrega
          test -f _public/index.html
          test -f _public/assets/orlando.mp4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
